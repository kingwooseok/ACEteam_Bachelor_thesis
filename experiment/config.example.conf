# Example (run on RX; copy this template outside the repo and edit it first):
#   ./experiment/run_matrix.sh --config /path/matrix.conf --plan
#   sudo -n ./experiment/run_matrix.sh --config /path/matrix.conf --run --session study01
#   python3 -m unittest analysis.tests.test_join_results analysis.tests.test_aggregate_runs
# D01–D11 only. INI data, never sourced as shell code. No passwords here.
# Run run_matrix.sh ON THE RECEIVER Linux host, from its checked-out repository.
# --plan is offline/unprivileged. --run needs local root (sudo -n) for XDP,
# HWTSTAMP/PHC, mlock and FIFO/RR. This runner does NOT set IRQ, governor,
# isolation, driver/kernel or perform preliminary Pi measurements.
# Preconfigure the common settings separately, including NIC IRQ -> CPU 2,
# single RX queue 0, AF_XDP copy support, PHC and adequate memlock/tmpfs/RAM.
# Prebuild both repositories; RX needs BPF tools and UDP tools, TX needs sender.
# RX: python3, taskset, chrt, stdbuf, stress-ng, mpstat, iperf3, ssh, git.
# TX: python3, taskset, chrt, mpstat, iperf3, sender; noninteractive sudo -n.
# Use a dedicated SSH host alias with key/agent auth and verified known_hosts.
# sudo on RX must retain access to that alias/key/agent (root's SSH config or
# carefully configured SSH_AUTH_SOCK). BatchMode + strict host checking is used.
# Use a separate management link where possible. No copying/building remotely.
# One SSH session owns TX children, cleans up on EOF/error, and has a watchdog.
# Output: plan.json maps A/B/C aliases to physical runs (20 conditions/200 runs
# for a distinct valid top PPS). Each run has RX logs/mpstat, TX logs/mpstat,
# placement/IRQ snapshots, before/after PHC CSV, raw ingress/CPUMAP/UDP/AF_XDP,
# per-flow joined CSV + JSON and hashed completion markers. Aggregate JSON
# contains target/actual sends, unique receives, sender shortfall and loss;
# latency CSV remains compatible. Flow 2/3 user-hw is compared to 100000 ns.
# Actual sends mean successful sender sendto(), not proven wire TX timestamps.
# Missing latency/calibration is not counted as a successful deadline result.
# Interruptions preserve raw evidence; incomplete runs are NEVER auto-reused.
# Analyze on RX: UDP files use native ABI. Archive the complete results tree.
[experiment]
# Absolute paths on the respective machines. Avoid placing results in source
# artifact directories; capture_manifest records project + kernel provenance.
rx_repo = /home/pi/ACEteam_Bachelor_thesis
tx_repo = /home/pi/ACEteam_Bachelor_thesis
kernel_tree = /home/pi/rt-experiment/linux-6.18-rt
kernel_base_ref = rpi-6.18.y
output_root = /home/pi/ace-results
tx_host = ace-sender
rx_address = 192.168.10.10
interface = eth0
# Explicit NIC IRQ numbers from prior setup; check effective_affinity_list=2.
# All NIC IRQs must be listed; no IRQ affinity is written by this runner.
nic_irqs =
# Fill from the other owner's preliminary measurement. Required for --run;
# must exceed 9000 and (top_pass_pps+2000)*60 <= 1048576 map capacity.
top_pass_pps =
# UDP iperf3 offered bandwidth in bits/sec, supplied from preliminary results.
# Both must be positive, medium < high. Not measured/guessed by this runner.
network_medium_bps =
network_high_bps =
iperf_port = 5201
payload_size = 64
# Receiver and sender management CPU are independent of network load CPU.
rx_management_cpu = 0
tx_management_cpu = 0
rx_network_cpu = 0
tx_network_cpu = 3
# Fixed design: flow 1=9000/PASS TX CPU0, 2=9001/CPUMAP TX CPU1,
# 3=9002/AF_XDP TX CPU2; 9001 receiver and CPUMAP destination are CPU3.
rx_pass_cpu = 0
rx_xsk_cpu = 1
# Per-flow policy/priority are identical in all-pass and mixed.
# other requires priority 0; fifo/rr require 1..99. Inherit no ambient RT policy.
pass_policy = other
pass_priority = 0
critical_policy = fifo
critical_priority = 80
# One stress-ng worker per specified CPU. C adds CPU3 or moves PASS to CPU3.
load_cpus = 0,1,2
# Fixed experiment timing: 5s stabilization + PHC before + 60s transmission.
# Drain is a bounded grace after senders stop, not a target-count wait.
drain_seconds = 2
stop_timeout_seconds = 30
ready_timeout_seconds = 20
# One receiver is created per active flow; PASS=0 means no PASS receiver/sender.
# UDP staging needs tmpfs and room for 56 bytes/sample plus process/map memory.
staging_root = /dev/shm
