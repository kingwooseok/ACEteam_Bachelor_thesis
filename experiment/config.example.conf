# Copy the identical completed file to BOTH Raspberry Pis.
# Blank experimental values must be selected before plan/run will accept it.
run_id=
receiver_address=
control_port=49090
repo=AUTO
output_root=results/experiment
interface=eth0
modes=mixed,all-pass
# 반복마다 모드 시작 순서를 반전한다(5회는 3:2).
alternate_mode_order=1
repeats=
duration_ms=
# Load stabilization before packet transmission; no packet warmup run.
warmup_ms=
# Late arrivals after sender completion, before bounded receiver drain.
settle_ms=
ready_timeout_ms=60000
stop_timeout_ms=60000
start_delay_ms=250
drain_ms=100
# 공통 값은 하위 호환용. 역할별 값은 서로 다른 Pi의 관리 CPU다.
supervisor_cpu=inherit
receiver.supervisor_cpu=
sender.supervisor_cpu=
receiver.network_cpu=
sender.network_cpu=3
# 본시험 준비 시 양측 governor 적용, 수신측 IRQ만 해당 CPU로 배치한다.
# socket-only 운영 검증에서는 이 설정을 기록하되 장치에 적용하지 않는다.
environment.governor=performance
environment.rx_irq_cpu=2
monitor=1
load.cpu_percent=
load.cpu_cpus=
load.cpu_method=all
load.memory_workers=0
load.memory_bytes=0
load.io_workers=0
load.io_path=/tmp
load.network_bps=
load.network_protocol=udp
load.network_direction=forward
load.network_port=5201
load.network_parallel=1
load.on_sec=0
load.off_sec=0
flow1.enabled=1
flow1.period_ns=
flow1.deadline_ns=0
flow1.tx_cpu=
flow1.rx_cpu=
flow1.tx_policy=
flow1.rx_policy=
flow1.tx_priority=
flow1.rx_priority=
flow2.enabled=1
flow2.period_ns=
flow2.deadline_ns=0
flow2.tx_cpu=
flow2.rx_cpu=
flow2.tx_policy=
flow2.rx_policy=
flow2.tx_priority=
flow2.rx_priority=
flow3.enabled=1
flow3.period_ns=
flow3.deadline_ns=0
flow3.tx_cpu=
flow3.rx_cpu=
flow3.tx_policy=
flow3.rx_policy=
flow3.tx_priority=
flow3.rx_priority=
