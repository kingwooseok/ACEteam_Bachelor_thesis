flow1.enabled=1
flow1.period_ns=2000000
flow1.tx_cpu=inherit
flow1.rx_cpu=inherit
flow1.tx_policy=other
flow1.rx_policy=other
flow1.tx_priority=0
flow1.rx_priority=0
flow2.enabled=1
flow2.period_ns=4000000
flow2.tx_cpu=inherit
flow2.rx_cpu=inherit
flow2.tx_policy=other
flow2.rx_policy=other
